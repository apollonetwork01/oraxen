name: Build Oraxen JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Patch Repositories for Iris
        run: |
          echo "dependencyResolutionManagement { repositories { maven { url = uri(\"https://repo.volmit.com/\") } } }" >> settings.gradle.kts || true
          echo "repositories { maven { url = uri(\"https://repo.volmit.com/\") } }" >> build.gradle.kts || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR with Gradle
        run: ./gradlew shadowJar --no-daemon -x test || ./gradlew build --no-daemon -x test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-Plugin
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-dev*.jar
