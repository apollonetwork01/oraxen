name: Build Oraxen JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Wipe Dead Volmit Repositories
        run: |
          find . -type f \( -name "*.kts" -o -name "*.gradle" -o -name "*.toml" \) -exec sed -i '/volmit/d' {} +
          find . -type f \( -name "*.kts" -o -name "*.gradle" -o -name "*.toml" \) -exec sed -i '/Iris/d' {} +

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew shadowJar --no-daemon -x test --continue || ./gradlew build --no-daemon -x test --continue

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-Plugin
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-dev*.jar
