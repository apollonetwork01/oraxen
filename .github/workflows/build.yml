name: Build Oraxen JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Remove Dead Volmit Dependencies and Java Code
        run: |
          # 1. Remove qualquer mencao a Volmit/Iris nos arquivos de build/configuracao
          find . -type f \( -name "*.kts" -o -name "*.gradle" -o -name "*.toml" \) -exec sed -i '/volmit/d' {} +
          find . -type f \( -name "*.kts" -o -name "*.gradle" -o -name "*.toml" \) -exec sed -i '/Iris/d' {} +

          # 2. Deleta as classes Java do Iris que nao compilam sem o JAR do Iris
          rm -rf src/main/java/io/th0rgal/oraxen/compatibilities/provided/iris

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR with Gradle
        run: ./gradlew build --no-daemon -x test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-Plugin
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-dev*.jar
