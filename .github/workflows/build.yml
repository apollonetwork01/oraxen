name: Build Oraxen JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Purge Iris References Entirely
        run: |
          # 1. Limpa configuracoes Gradle/Toml
          find . -type f \( -name "*.kts" -o -name "*.gradle" -o -name "*.toml" \) -exec sed -i '/volmit/dI' {} +
          find . -type f \( -name "*.kts" -o -name "*.gradle" -o -name "*.toml" \) -exec sed -i '/Iris/dI' {} +

          # 2. Apaga a pasta de codigo do Iris
          rm -rf src/main/java/io/th0rgal/oraxen/compatibilities/provided/iris

          # 3. Remove os imports e chamadas do Iris nos gerenciadores Java
          find src/ -type f -name "*.java" -exec sed -i '/io.th0rgal.oraxen.compatibilities.provided.iris/d' {} +
          find src/ -type f -name "*.java" -exec sed -i '/IrisCompatibility/d' {} +

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR with Gradle
        run: ./gradlew build --no-daemon -x test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-Plugin
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-dev*.jar
